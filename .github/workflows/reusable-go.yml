name: Reusable Go checks

on:
  workflow_call:
    inputs:
      go-version:
        type: string
        default: "1.23"
      working-directory:
        type: string
        default: "."
      postgres-version:
        description: >-
          Версия PostgreSQL для тестов, работающих против живой базы.
          Пустое значение — база не поднимается, такие тесты пропускаются.
        type: string
        default: ""
      redis-version:
        description: >-
          Версия Redis для тестов, работающих против живого Redis.
          Пустое значение — Redis не поднимается, такие тесты пропускаются.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect Go module
        id: detect
        run: |
          if [ -f go.mod ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::go.mod ещё нет — проверки пропущены"
          fi

          # Конфиг golangci-lint v2 начинается с `version: "2"`. Такой конфиг
          # и Go 1.25+ требуют линтер второй версии: v1 собран на Go 1.24 и
          # не разбирает стандартную библиотеку новых версий. Репозитории со
          # старым конфигом проверяются, как раньше, линтером v1.
          lint_v2=false
          for config in .golangci.yml .golangci.yaml; do
            if [ -f "$config" ] && grep -Eq '^version:[[:space:]]*"?2"?[[:space:]]*$' "$config"; then
              lint_v2=true
            fi
          done
          echo "lint-v2=$lint_v2" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        if: steps.detect.outputs.found == 'true'
        with:
          go-version: ${{ inputs.go-version }}
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum

      # Служба `services:` не умеет включаться по условию, поэтому база
      # поднимается шагом: без postgres-version шаг не выполняется вовсе.
      - name: Start PostgreSQL
        if: steps.detect.outputs.found == 'true' && inputs.postgres-version != ''
        run: |
          docker run -d --name enot-test-postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=enot_test \
            -p 5432:5432 \
            "postgres:${{ inputs.postgres-version }}-alpine"

          for _ in $(seq 1 30); do
            if docker exec enot-test-postgres pg_isready -U postgres -d enot_test >/dev/null 2>&1; then
              echo "ENOT_TEST_DB_DSN=postgres://postgres:postgres@127.0.0.1:5432/enot_test?sslmode=disable" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done

          echo "::error::PostgreSQL не поднялся за отведённое время"
          docker logs enot-test-postgres || true
          exit 1

      # Тот же приём, что и с базой: служба по условию не включается,
      # поэтому Redis поднимается шагом.
      - name: Start Redis
        if: steps.detect.outputs.found == 'true' && inputs.redis-version != ''
        run: |
          docker run -d --name enot-test-redis \
            -p 6379:6379 \
            "redis:${{ inputs.redis-version }}-alpine"

          for _ in $(seq 1 30); do
            if docker exec enot-test-redis redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "ENOT_TEST_REDIS_ADDR=127.0.0.1:6379" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done

          echo "::error::Redis не поднялся за отведённое время"
          docker logs enot-test-redis || true
          exit 1

      - name: Verify formatting
        if: steps.detect.outputs.found == 'true'
        run: |
          go install mvdan.cc/gofumpt@latest
          unformatted="$(gofumpt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::Файлы не отформатированы gofumpt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        if: steps.detect.outputs.found == 'true'
        run: go build ./...

      - name: Vet
        if: steps.detect.outputs.found == 'true'
        run: go vet ./...

      - name: Test
        if: steps.detect.outputs.found == 'true'
        run: go test ./... -race -count=1 -coverprofile=coverage.out

      - name: Lint
        if: steps.detect.outputs.found == 'true' && steps.detect.outputs.lint-v2 != 'true'
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: ${{ inputs.working-directory }}

      # Версия линтера закреплена: новый выпуск может включить проверки,
      # которые уронят CI без изменений в коде. Обновляется отдельным PR.
      - name: Lint (golangci-lint v2)
        if: steps.detect.outputs.found == 'true' && steps.detect.outputs.lint-v2 == 'true'
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          working-directory: ${{ inputs.working-directory }}
