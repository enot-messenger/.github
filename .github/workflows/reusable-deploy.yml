name: Reusable build and deploy

# Собирает образ, публикует в ghcr.io встроенным GITHUB_TOKEN и разворачивает
# его на VPS по SSH. Community Server через этот workflow не деплоится.

on:
  workflow_call:
    inputs:
      image-name:
        type: string
        required: true
      dockerfile:
        type: string
        default: "Dockerfile"
      compose-file:
        type: string
        default: "docker-compose.yml"
      service:
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Detect Dockerfile
        id: detect
        run: |
          if [ -f "${{ inputs.dockerfile }}" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Dockerfile ещё нет — деплой пропущен"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.detect.outputs.found == 'true'

      - uses: docker/login-action@v3
        if: steps.detect.outputs.found == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.detect.outputs.found == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            ${{ vars.REGISTRY }}/${{ inputs.image-name }}:${{ github.sha }}
            ${{ vars.REGISTRY }}/${{ inputs.image-name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy over SSH
        if: steps.detect.outputs.found == 'true'
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          IMAGE: ${{ vars.REGISTRY }}/${{ inputs.image-name }}:${{ github.sha }}
          SERVICE: ${{ inputs.service }}
          COMPOSE_FILE: ${{ inputs.compose-file }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::notice::Переменные DEPLOY_* не заданы — деплой пропущен"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" bash -se <<REMOTE
            set -euo pipefail
            cd "$DEPLOY_PATH"
            # Сохраняем текущий тег для откита
            previous="\$(docker compose -f "$COMPOSE_FILE" config --images | grep "$SERVICE" || true)"
            echo "\$previous" > ".previous-$SERVICE" || true
            export ${SERVICE^^}_IMAGE="$IMAGE"
            docker compose -f "$COMPOSE_FILE" pull "$SERVICE"
            docker compose -f "$COMPOSE_FILE" up -d --no-deps "$SERVICE"
            # Health-check: ждём healthy до 90 секунд
            for i in \$(seq 1 30); do
              status="\$(docker inspect --format '{{ .State.Health.Status }}' "\$(docker compose -f "$COMPOSE_FILE" ps -q "$SERVICE")" 2>/dev/null || echo starting)"
              if [ "\$status" = "healthy" ]; then echo "Сервис healthy"; exit 0; fi
              if [ "\$status" = "unhealthy" ]; then break; fi
              sleep 3
            done
            echo "Health-check не пройден, откатываемся"
            docker compose -f "$COMPOSE_FILE" up -d --no-deps "$SERVICE" --force-recreate
            exit 1
          REMOTE

      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/deploy_key
