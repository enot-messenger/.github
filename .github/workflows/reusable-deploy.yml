name: Reusable build and deploy

# Собирает образ, публикует в ghcr.io встроенным GITHUB_TOKEN и разворачивает
# его на VPS по SSH. Community Server через этот workflow не деплоится.
#
# Окружения (environment) намеренно не используются: в приватных репозиториях
# они доступны только на платных тарифах, поэтому все параметры деплоя берутся
# из переменных и секретов уровня репозитория.

on:
  workflow_call:
    inputs:
      image-name:
        type: string
        required: true
      dockerfile:
        type: string
        default: "Dockerfile"
      compose-file:
        type: string
        default: "docker-compose.yml"
      service:
        type: string
        required: true
      # Одноразовый сервис compose, который нужно выполнить на новом образе
      # до подмены целевого сервиса (например core-migrate для наката схемы).
      # Пусто — шаг пропускается. Ненулевой код возврата останавливает деплой,
      # работающий контейнер остаётся на прежнем образе.
      pre-deploy-service:
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Входы передаются через окружение, а не подстановкой в текст скрипта:
      # так значение не может стать частью команды оболочки.
      - name: Detect Dockerfile
        id: detect
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          if [ -f "$DOCKERFILE" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Dockerfile ещё нет — деплой пропущен"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.detect.outputs.found == 'true'

      - uses: docker/login-action@v3
        if: steps.detect.outputs.found == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.detect.outputs.found == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            ${{ vars.REGISTRY }}/${{ inputs.image-name }}:${{ github.sha }}
            ${{ vars.REGISTRY }}/${{ inputs.image-name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy over SSH
        if: steps.detect.outputs.found == 'true'
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          IMAGE: ${{ vars.REGISTRY }}/${{ inputs.image-name }}:${{ github.sha }}
          SERVICE: ${{ inputs.service }}
          PRE_SERVICE: ${{ inputs.pre-deploy-service }}
          COMPOSE_FILE: ${{ inputs.compose-file }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::notice::Переменные DEPLOY_* не заданы — деплой пропущен"
            exit 0
          fi
          # Имя переменной образа для compose: core-gateway -> CORE_GATEWAY_IMAGE.
          # ${SERVICE^^} давал CORE-GATEWAY_IMAGE, а export с дефисом падает.
          IMAGE_VAR="$(printf '%s' "$SERVICE" | tr '[:lower:]-' '[:upper:]_')_IMAGE"
          echo "Переменная образа: $IMAGE_VAR"
          # Одноразовый сервис берёт образ из своей переменной по тому же правилу:
          # core-migrate -> CORE_MIGRATE_IMAGE.
          PRE_IMAGE_VAR="NONE"
          if [ -n "$PRE_SERVICE" ]; then
            PRE_IMAGE_VAR="$(printf '%s' "$PRE_SERVICE" | tr '[:lower:]-' '[:upper:]_')_IMAGE"
            echo "Перед деплоем выполняется: $PRE_SERVICE ($PRE_IMAGE_VAR)"
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # Скрипт уходит на сервер через stdin, поэтому каждая удалённая команда,
          # которая сама читает stdin, съела бы остаток скрипта и деплой молча
          # оборвался бы с кодом 0. Всем таким командам закрываем ввод: </dev/null.
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" bash -se <<REMOTE
            set -euo pipefail
            cd "$DEPLOY_PATH"
            # Сохраняем текущий тег для отката
            # Образ, который работает сейчас: нужен для честного отката
            previous="\$(docker compose -f "$COMPOSE_FILE" ps --format '{{ .Image }}' "$SERVICE" | head -n 1 || true)"
            echo "\$previous" > ".previous-$SERVICE" || true
            export $IMAGE_VAR="$IMAGE"
            docker compose -f "$COMPOSE_FILE" pull "$SERVICE" </dev/null
            # Одноразовый шаг до подмены сервиса: миграции применяются на новом
            # образе, пока работает прежний контейнер. Падение прерывает деплой
            # из-за set -e, и подмены не происходит.
            # -T и </dev/null обязательны: без них run забирает stdin сессии.
            if [ -n "$PRE_SERVICE" ]; then
              export $PRE_IMAGE_VAR="$IMAGE"
              echo "Выполняем $PRE_SERVICE на $IMAGE"
              docker compose -f "$COMPOSE_FILE" run --rm -T "$PRE_SERVICE" </dev/null
              echo "$PRE_SERVICE отработал успешно"
            fi
            # Зависимости сервиса поднимаются отдельной командой: --no-deps
            # ниже их не запускает, а сервис, которому нужны база, Redis или
            # шина, не стартует и уходит в unhealthy. --no-recreate не трогает
            # уже работающие контейнеры, включая прежний контейнер сервиса —
            # его подменяет следующая команда.
            docker compose -f "$COMPOSE_FILE" up -d --no-recreate "$SERVICE" </dev/null
            docker compose -f "$COMPOSE_FILE" up -d --no-deps "$SERVICE" </dev/null
            # Явно убеждаемся, что контейнер действительно поехал на новом образе:
            # тихая неподмена уже один раз прошла мимо зелёного деплоя.
            current="\$(docker compose -f "$COMPOSE_FILE" ps --format '{{ .Image }}' "$SERVICE" | head -n 1 || true)"
            echo "Контейнер работает на образе: \$current"
            if [ "\$current" != "$IMAGE" ]; then
              echo "Образ не подменился: ожидали $IMAGE"
              exit 1
            fi
            # Health-check: ждём healthy до 90 секунд
            for i in \$(seq 1 30); do
              status="\$(docker inspect --format '{{ .State.Health.Status }}' "\$(docker compose -f "$COMPOSE_FILE" ps -q "$SERVICE")" 2>/dev/null || echo starting)"
              if [ "\$status" = "healthy" ]; then echo "Сервис healthy"; exit 0; fi
              if [ "\$status" = "unhealthy" ]; then break; fi
              sleep 3
            done
            echo "Health-check не пройден, откатываемся"
            # Журнал контейнера до откатa: иначе причина падения уезжает вместе
            # с пересозданным контейнером, и деплой сообщает только сам факт.
            echo "--- Состояние и журнал $SERVICE ---"
            docker compose -f "$COMPOSE_FILE" ps "$SERVICE" </dev/null || true
            docker compose -f "$COMPOSE_FILE" logs --tail 50 --no-color "$SERVICE" </dev/null || true
            echo "--- Конец журнала ---"
            if [ -n "\$previous" ]; then
              export $IMAGE_VAR="\$previous"
              docker compose -f "$COMPOSE_FILE" up -d --no-deps --force-recreate "$SERVICE" </dev/null
              echo "Откат на \$previous выполнен"
            else
              echo "Предыдущий образ неизвестен, автоматический откат невозможен"
            fi
            exit 1
          REMOTE

      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/deploy_key
