name: Reusable Node checks

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"
      package-manager:
        type: string
        default: "pnpm"

permissions:
  contents: read

jobs:
  checks:
    # Сервер задачи — из переменной репозитория, который вызвал workflow:
    # CI_RUNNER=enot отправляет задачу на собственный сервер CI, без
    # переменной — на серверы GitHub (enot-infra/docs/runner-setup.md, §3).
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect package manifest
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::package.json ещё нет — проверки пропущены"
          fi

      # Node ставит только setup-node: на собственном сервере CI его нет,
      # а corepack входит в Node. Поэтому порядок такой: Node, затем corepack
      # (появляется pnpm), затем повторный setup-node — он уже не скачивает
      # Node, а только включает кеш, которому нужен pnpm.
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.found == 'true'
        with:
          node-version: ${{ inputs.node-version }}

      - name: Enable corepack
        if: steps.detect.outputs.found == 'true' && inputs.package-manager == 'pnpm'
        run: corepack enable

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.found == 'true'
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}

      - name: Install
        if: steps.detect.outputs.found == 'true'
        run: ${{ inputs.package-manager }} install --frozen-lockfile

      - name: Lint
        if: steps.detect.outputs.found == 'true'
        run: ${{ inputs.package-manager }} run lint

      - name: Types
        if: steps.detect.outputs.found == 'true'
        run: ${{ inputs.package-manager }} run typecheck

      - name: Test
        if: steps.detect.outputs.found == 'true'
        run: ${{ inputs.package-manager }} run test

      - name: Build
        if: steps.detect.outputs.found == 'true'
        run: ${{ inputs.package-manager }} run build
