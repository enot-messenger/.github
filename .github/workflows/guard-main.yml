name: Guard main

on:
  push:
    branches: [main]

# pull-requests: read нужен сторожу, чтобы увидеть связанный с коммитом PR.
# Вызываемый workflow не может получить прав больше, чем у вызывающего.
permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  guard:
    uses: enot-messenger/.github/.github/workflows/reusable-guard-main.yml@main
